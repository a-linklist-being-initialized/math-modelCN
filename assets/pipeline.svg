    <circle cx="1038" cy="120" r="16" fill="#dc2626"/><text x="1038" y="126" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">6</text>
    <text x="1064" y="126" font-size="15" font-weight="700" fill="#991b1b">6verity</text>
