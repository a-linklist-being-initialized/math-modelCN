    <text x="46" y="362" font-size="12" fill="#475569">检查 Python / R / LaTeX / Typst / DrawIO 等依赖，缺什么给什么安装命令</text>

    <rect x="630" y="316" width="580" height="60" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="646" y="340" font-size="13" font-weight="700" fill="#0f172a">🤖 aigc-trace-cleaner · 降 AI 痕迹</text>
    <text x="646" y="362" font-size="12" fill="#475569">10 维痕迹检测 + 2026 国赛 AI 合规 26 条自查，出报告与改写建议</text>

    <rect x="30" y="390" width="580" height="60" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="46" y="414" font-size="13" font-weight="700" fill="#0f172a">🎨 mathmodel-figure-templates · 科研绘图</text>
