    <rect x="30" y="92" width="176" height="200" rx="14" fill="url(#s1)" stroke="#93c5fd"/>
    <circle cx="58" cy="120" r="16" fill="#2563eb"/><text x="58" y="126" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text>
