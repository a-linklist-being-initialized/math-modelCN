    <rect x="630" y="316" width="0" height="0"/>
    <rect x="630" y="390" width="580" height="60" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="646" y="414" font-size="13" font-weight="700" fill="#0f172a">📚 _references + 数学建模算法 · 共享知识</text>
    <text x="646" y="436" font-size="12" fill="#475569">写作/题型/图表规范 + 32 份算法资料（规划、图论、回归、时序列…）</text>
