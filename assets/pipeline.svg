    <rect x="1022" y="238" width="176" height="40" rx="8" fill="#ffffff" stroke="#fecaca"/>
    <text x="1032" y="254" font-size="11.5" fill="#b91c1c">产出</text>
    <text x="1032" y="270" font-size="11" font-weight="600" fill="#1e293b">验收清单 + 提交就绪</text>

    <!-- 箭头 -->
    <g stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" fill="none">
      <path d="M210 192 H222"/><path d="M406 192 H418"/><path d="M602 192 H614"/>
      <path d="M798 192 H810"/><path d="M994 192 H1006"/>
